[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excursionlens-api"
version = "0.1.0"
description = "ExcursionLens API — Cold-Chain Temperature Excursion Investigation Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["app", "."]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"
