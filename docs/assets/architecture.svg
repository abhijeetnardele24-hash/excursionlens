      <text x="8" y="20" fill="#365E7D" font-size="8.5" font-weight="700">REVIEW EXPORTS</text>
      <text x="8" y="38" fill="#EAE7DE" font-size="9">Printable HTML Packet</text>
      <text x="8" y="54" fill="#EAE7DE" font-size="9">Structured JSON</text>
      <text x="8" y="70" fill="#A2ADA6" font-size="8">Structured evidence trail</text>
      <text x="8" y="82" fill="#A2ADA6" font-size="8">Sign-off fields included</text>
