      <text x="12" y="22" fill="#275E4B" font-size="10" font-weight="700">TIME-SERIES TELEMETRY</text>
      <text x="12" y="40" fill="#EAE7DE" font-size="12" font-weight="600">5-Min Sensor Intervals</text>
      <text x="12" y="54" fill="#A2ADA6" font-size="10">Albany DC &rarr; Kingston Clinic</text>
    </g>

    <g transform="translate(15, 215)">
      <rect width="200" height="85" rx="5" fill="#141D1B" stroke="#2D403B"/>
      <text x="12" y="22" fill="#365E7D" font-size="10" font-weight="700">OPERATIONAL &amp; CUSTODY</text>
      <text x="12" y="40" fill="#EAE7DE" font-size="11">10:18 Door Open (24m)</text>
      <text x="12" y="56" fill="#EAE7DE" font-size="11">10:20 Dock 3 Transfer</text>
      <text x="12" y="72" fill="#EAE7DE" font-size="11">Nominal Reefer Telemetry</text>
    </g>

    <g transform="translate(15, 315)">
      <rect width="200" height="155" rx="5" fill="#141D1B" stroke="#2D403B"/>
      <text x="12" y="22" fill="#9A6A1F" font-size="10" font-weight="700">SAFETY BOUNDARY</text>
      <text x="12" y="42" fill="#EAE7DE" font-size="10.5" font-style="italic">
        <tspan x="12" y="42">"Investigation support only.</tspan>
        <tspan x="12" y="58">Not a product disposition,</tspan>
        <tspan x="12" y="74">medical decision, or</tspan>
        <tspan x="12" y="90">regulatory release."</tspan>
