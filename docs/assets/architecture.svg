  <text x="65" y="646" fill="#A2ADA6" font-size="10.5">ExcursionLens — Bounded Multi-Step Agentic Architecture &bull; Nebius x NVIDIA Global AI Hackathon (Best Apps &amp; Agents Track)</text>
  <text x="940" y="646" fill="#275E4B" font-size="10.5" font-weight="700">STATUS: VERIFIED</text>
