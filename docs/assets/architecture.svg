      <text x="12" y="40" fill="#EAE7DE" font-size="12" font-weight="600">NMB-204 Biologic</text>
      <text x="12" y="54" fill="#A2ADA6" font-size="10">450 doses · 2.0°C-8.0°C policy</text>
    </g>

    <g transform="translate(15, 135)">
