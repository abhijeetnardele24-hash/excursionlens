      <text x="10" y="52" fill="#EAE7DE" font-size="10">Catches probe thermal lag</text>
      <text x="10" y="66" fill="#B5482D" font-size="10" font-weight="700">Downgrades HYP-02</text>
      <text x="10" y="82" fill="#A2ADA6" font-size="9">Requires receiving seal check</text>
      <text x="10" y="96" fill="#A2ADA6" font-size="9">Identifies missing evidence</text>
