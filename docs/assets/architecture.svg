      <stop offset="0%" stop-color="#275E4B" />
      <stop offset="100%" stop-color="#1A4033" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5482D" />
      <stop offset="100%" stop-color="#8E351F" />
    </linearGradient>
