    <g transform="translate(15, 55)">
      <rect width="200" height="95" rx="5" fill="#141D1B" stroke="#275E4B"/>
      <text x="12" y="22" fill="#275E4B" font-size="10" font-weight="700">EXCURSION DETECTOR</text>
      <text x="12" y="40" fill="#EAE7DE" font-size="11">Duration: 40.0 minutes</text>
      <text x="12" y="56" fill="#EAE7DE" font-size="11">Peak Temp: 10.5°C</text>
      <text x="12" y="72" fill="#EAE7DE" font-size="11">Degree-Minutes: 50.5°C·min</text>
