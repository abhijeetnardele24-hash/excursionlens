      <text x="8" y="36" fill="#EAE7DE" font-size="8.5">1. Inspect dock CCTV</text>
      <text x="8" y="50" fill="#EAE7DE" font-size="8.5">2. Check receiving seal</text>
      <text x="8" y="64" fill="#EAE7DE" font-size="8.5">3. Review core probe</text>
      <text x="8" y="78" fill="#EAE7DE" font-size="8.5">4. Manufacturer SOP</text>
    </g>

    <g transform="translate(10, 270)">
