    <g transform="translate(12, 315)">
      <rect width="186" height="70" rx="5" fill="#141D1B" stroke="#365E7D"/>
      <text x="10" y="20" fill="#365E7D" font-size="9.5" font-weight="700">COUNTERFACTUAL REPLAY</text>
      <text x="10" y="38" fill="#EAE7DE" font-size="10">Simulates 5-Min Door Close</text>
      <text x="10" y="54" fill="#275E4B" font-size="10" font-weight="700">Excursion Drops: 40m &rarr; 0m</text>
