name: Live Sponsor Provider Verification (Nebius & Tavily)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Optional trigger context or testing note'
        required: false
        default: 'Manual live provider verification dispatch'

jobs:
  live-smoke:
    name: Live Nebius Token Factory & Tavily Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository at Exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Provider Smoke Test (Fail-Closed)
        env:
          NEBIUS_TOKEN_FACTORY_KEY: ${{ secrets.NEBIUS_TOKEN_FACTORY_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/live_smoke.py

      - name: Upload Live Provider Machine-Readable Receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-receipts-${{ github.sha }}
          path: |
            docs/live-smoke-receipt.json
            docs/provider-receipts.json

