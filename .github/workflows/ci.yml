name: ExcursionLens CI & Quality Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Benchmark, Security & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov httpx fastapi uvicorn pydantic pydantic-settings python-dotenv

      - name: Install Frontend Dependencies
        run: |
          npm --prefix apps/web ci

      - name: Backend Linting (Ruff)
        run: |
          ruff check apps/api benchmark

      - name: Backend Type Checking (Mypy)
        run: |
          mypy apps/api/app --ignore-missing-imports

      - name: Frontend TypeScript & Production Build
        run: |
          npm --prefix apps/web run build

      - name: Deterministic Benchmark Suite (12 Scenarios)
        run: |
          python benchmark/run_benchmark.py

      - name: Backend Unit & Integration Tests with Coverage
        run: |
          python -m pytest --cov=apps/api/app --cov-report=term-missing apps/api/tests

      - name: Claims & Citation Security Scan
        run: |
          python -m pytest apps/api/tests/test_claims_validator.py

      - name: Preflight Check (Live Provider Gate)
        run: |
          python scripts/preflight.py || true

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Playwright E2E & Axe Accessibility Tests
        run: |
          npx playwright test --project=desktop-1280

      - name: Docker Smoke Build
        run: |
          docker build -t excursionlens:ci .
