name: ExcursionLens CI & Quality Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test, Benchmark, Security, E2E & Container Probe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov pytest-asyncio hypothesis pip-audit

      - name: Install Root & Frontend Dependencies
        run: |
          npm ci
          npm --prefix apps/web ci

      - name: Backend Linting (Ruff)
        run: |
          ruff check apps/api benchmark scripts

      - name: Backend Type Checking (Mypy with --check-untyped-defs)
        run: |
          mypy apps/api/app --ignore-missing-imports --check-untyped-defs

      - name: Frontend TypeScript & Production Build
        run: |
          npm --prefix apps/web run build

      - name: Workspace & Git History Secret Scan
        run: |
          python scripts/security_scan.py

      - name: Dependency Vulnerability Audit (Python & npm)
        run: |
          pip-audit -r requirements.txt --desc on
          npm audit --audit-level=high
          npm audit --prefix apps/web --audit-level=high

      - name: Deterministic Benchmark Suite (12 Scenarios)
        run: |
          python benchmark/run_benchmark.py

      - name: Backend Unit & Integration Tests with Declared Coverage Threshold (>= 85% statement, >= 80% branch)
        run: |
          python -m pytest apps/api/tests --cov=apps/api/app --cov-branch --cov-report=term-missing --cov-report=json:test-results/coverage.json --cov-fail-under=85

      - name: Enforce Strict Unrounded Coverage Thresholds (>= 85.0% Statement, >= 80.0% Branch)
        run: |
          python -c "
          import json, sys
          with open('test-results/coverage.json', 'r', encoding='utf-8') as f:
              cov = json.load(f)
          totals = cov.get('totals', {})
          num_stmts = totals.get('num_statements', 0)
          covered_stmts = totals.get('covered_lines', totals.get('covered_statements', 0))
          stmt_pct = (covered_stmts / num_stmts * 100.0) if num_stmts else 0.0

          num_branches = totals.get('num_branches', 0)
          covered_branches = totals.get('covered_branches', 0)
          branch_pct = (covered_branches / num_branches * 100.0) if num_branches else 0.0

          print(f'Coverage Check: Statements: {covered_stmts}/{num_stmts} ({stmt_pct:.3f}%), Branches: {covered_branches}/{num_branches} ({branch_pct:.3f}%)')

          failed = False
          if stmt_pct < 85.0:
              print(f'❌ Statement coverage {stmt_pct:.3f}% is below 85.0% minimum threshold!', file=sys.stderr)
              failed = True
          else:
              print(f'✅ Statement coverage {stmt_pct:.3f}% >= 85.0% (Passed)')

          if branch_pct < 80.0:
              print(f'❌ Branch coverage {branch_pct:.3f}% is below 80.0% minimum unrounded threshold!', file=sys.stderr)
              failed = True
          else:
              print(f'✅ Branch coverage {branch_pct:.3f}% >= 80.0% (Passed without rounding)')

          if failed:
              sys.exit(1)
          "

      - name: Claims & Citation Security Tests
        run: |
          python -m pytest apps/api/tests/test_claims_validator.py

      - name: Documentation Claims Audit & Regression Suite
        run: |
          python scripts/test_check_claims.py
          python scripts/check_claims.py

      - name: Live Provider Verification Gate (Fail-Closed)
        run: |
          python -c "
          import os, sys, subprocess, json
          has_keys = bool(os.environ.get('NEBIUS_TOKEN_FACTORY_KEY') and os.environ.get('TAVILY_API_KEY'))
          if has_keys:
              rc = subprocess.run([sys.executable, 'scripts/live_smoke.py']).returncode
              sys.exit(rc)
          else:
              print('⚠️  MANDATORY GATE NOTICE: NEBIUS / TAVILY SECRETS NOT CONFIGURED IN RUNNER.')
              print('   Status: BLOCKED/NOT_MEASURED')
              print('   Recording blocked provider gate receipt.')
              subprocess.run([sys.executable, 'scripts/live_smoke.py'])
              with open('docs/live-smoke-receipt.json') as f:
                  data = json.load(f)
              assert data['status'] == 'BLOCKED', f'Expected BLOCKED but got {data[\"status\"]}'
              print('   Verified provider gate status: BLOCKED (Truthful fail-closed gate recorded)')
          "

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Playwright E2E & Axe Accessibility Tests (All 5 Viewport Projects)
        run: |
          npx playwright test

      - name: Master Verification Runner
        run: |
          python scripts/verify.py

      - name: Docker Build, Container Startup, Health/Meta Probe & Clean Shutdown
        run: |
          docker build --build-arg GIT_COMMIT=${{ github.sha }} -t excursionlens:ci .
          docker run -d --name excursionlens-ci -p 8000:8000 excursionlens:ci
          sleep 5
          python -c "
          import json, urllib.request, sys
          expected_sha = '${{ github.sha }}'

          # 1. Parse /api/health
          with urllib.request.urlopen('http://127.0.0.1:8000/api/health') as resp:
              assert resp.status == 200, f'Health HTTP status: {resp.status}'
              health = json.loads(resp.read().decode())

          print('Health response:', json.dumps(health, indent=2))
          assert health['status'] == 'ok', f'Health status unexpected: {health}'
          assert health.get('commit') == expected_sha, f'Health commit mismatch: {health.get(\"commit\")} != {expected_sha}'
          assert health.get('application_environment') == 'docker', f'Health environment mismatch: {health.get(\"application_environment\")}'
          assert health.get('provider_status') == 'NOT_CONFIGURED', f'Health provider_status mismatch: {health.get(\"provider_status\")}'
          assert health.get('live_execution_verified') is False, f'Health live_execution_verified expected False: {health}'
          assert health.get('provider_mode') == 'DEMO_FIXTURE', f'Health provider_mode mismatch: {health.get(\"provider_mode\")}'

          # 2. Parse /api/meta
          with urllib.request.urlopen('http://127.0.0.1:8000/api/meta') as resp:
              assert resp.status == 200, f'Meta HTTP status: {resp.status}'
              meta = json.loads(resp.read().decode())

          print('Meta response:', json.dumps(meta, indent=2))
          assert meta.get('commit') == expected_sha, f'Meta commit mismatch: {meta.get(\"commit\")} != {expected_sha}'
          assert meta.get('application_environment') == 'docker', f'Meta environment mismatch: {meta.get(\"application_environment\")}'
          assert meta.get('provider_status') == 'NOT_CONFIGURED', f'Meta provider_status mismatch: {meta.get(\"provider_status\")}'
          assert meta.get('live_execution_verified') is False, f'Meta live_execution_verified expected False: {meta}'
          assert meta.get('provider_mode') == 'DEMO_FIXTURE', f'Meta provider_mode mismatch: {meta.get(\"provider_mode\")}'

          print('✅ All Docker CI assertions passed: exact SHA, docker environment, truthful NOT_CONFIGURED state')
          "

          # 3. Assert container runtime process is non-root
          CONTAINER_USER=$(docker exec excursionlens-ci whoami)
          CONTAINER_UID=$(docker exec excursionlens-ci id -u)
          echo "Container runtime user: $CONTAINER_USER (UID: $CONTAINER_UID)"
          if [ "$CONTAINER_UID" -eq 0 ] || [ "$CONTAINER_USER" = "root" ]; then
            echo "❌ Runtime container process is running as root!" >&2
            exit 1
          fi
          echo "✅ Runtime container process verified as non-root user ($CONTAINER_USER, UID $CONTAINER_UID)"

          docker stop excursionlens-ci
          docker rm excursionlens-ci

      - name: Deployment Probe & Receipt Generation (Fail-Closed)
        run: |
          python -c "
          import os, sys, subprocess, json
          deploy_url = os.environ.get('DEPLOY_URL', '').strip()
          if deploy_url:
              rc = subprocess.run([sys.executable, 'scripts/deploy_smoke.py', '--url', deploy_url]).returncode
              if rc != 0:
                  sys.exit(rc)
          else:
              print('⚠️  MANDATORY GATE NOTICE: DEPLOY_URL NOT CONFIGURED IN RUNNER.')
              print('   Status: BLOCKED / NOT CONFIGURED')
              print('   Recording blocked deployment gate receipt.')
              subprocess.run([sys.executable, 'scripts/deploy_smoke.py'])
              with open('docs/deployment-receipt.json') as f:
                  data = json.load(f)
              assert data['status'] == 'BLOCKED', f'Expected BLOCKED but got {data[\"status\"]}'
              print('   Verified deployment gate status: BLOCKED (Truthful fail-closed gate recorded)')
          "

      - name: Upload Machine-Readable Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts-${{ github.sha }}
          path: |
            docs/verification-results.json
            docs/live-smoke-receipt.json
            docs/provider-receipts.json
            docs/deployment-receipt.json
            test-results/
            playwright-report/
